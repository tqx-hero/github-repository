<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>404 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box‑sizing: border‑box;
        }
        body {
            height: 100vh;
            display: flex;
            flex‑direction: column;
            justify‑content: center;
            align‑items: center;
            background‑color: #f5f7fa;
            font‑family: system‑ui, sans‑serif;
            color: #333;
        }
        .wrap {
            text‑align: center;
        }
        h1 {
            font‑size: 120px;
            color: #e74c3c;
            line‑height: 1;
        }
        h2 {
            font‑size: 24px;
            margin‑top: 16px;
            margin‑bottom: 12px;
        }
        p {
            color: #666;
            margin‑bottom: 32px;
        }
        a {
            padding: 12px 28px;
            background‑color: #2563eb;
            color: white;
            text‑decoration: none;
            border‑radius: 6px;
            transition: background 0.2s;
        }
        a:hover {
            background‑color: #1d4ed8;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>404</h1>
    <h2>页面找不到了</h2>
    <p>你访问的资源不存在或者链接已经失效</p>
    <a href="/">返回首页</a>
</div>
</body>
</html>
